name: Desktop quality and release

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Contracts, tests, and static analysis
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy,rustfmt

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          & .\.venv\Scripts\python.exe -m pip install --upgrade pip
          & .\.venv\Scripts\python.exe -m pip install -e ".[desktop-build]"

      - name: Install desktop dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify generated desktop contracts
        run: .\.venv\Scripts\python.exe scripts\export_desktop_contracts.py --check

      - name: Run Python tests
        run: .\.venv\Scripts\python.exe -m unittest discover -s tests

      - name: Run desktop tests
        run: pnpm desktop:test

      - name: Build desktop frontend
        run: pnpm desktop:build

      - name: Check Rust formatting
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --all -- --check

      - name: Run Rust Clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        working-directory: apps/desktop/src-tauri
        run: cargo test --all-targets --all-features

  windows-release:
    name: Build verified Windows installer
    needs: quality
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@1.98.0

      - name: Install release dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          & .\.venv\Scripts\python.exe -m pip install --upgrade pip
          & .\.venv\Scripts\python.exe -m pip install -e ".[desktop-build]"
          pnpm install --frozen-lockfile

      - name: Build NSIS release
        shell: pwsh
        run: .\scripts\build_desktop_release.ps1 -Bundle nsis

      - name: Verify release integrity
        shell: pwsh
        run: .\scripts\verify_desktop_release.ps1 -Bundle nsis

      - uses: actions/upload-artifact@v4
        with:
          name: project-sora-windows-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/binaries/sora-gateway-manifest.json
