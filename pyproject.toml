[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sora-agent-state-sandbox"
version = "0.1.0"
description = "Project Sora agent runtime with governed model-provider routing and BYOK support."
requires-python = ">=3.11"
dependencies = [
    "cryptography>=43.0.0",
    "fastapi>=0.135.0,<1.0.0",
    "httpx>=0.28.0,<1.0.0",
    "keyring>=25.0.0",
    "pydantic>=2.12.0,<3.0.0",
    "uvicorn>=0.41.0,<1.0.0",
    "websockets>=15.0,<17.0",
]

[project.optional-dependencies]
desktop-build = [
    "pyinstaller==6.22.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sora_sandbox.worldops" = ["schemas/*.json", "eval_data/*.jsonl"]
"sora_sandbox.conversation_runtime" = ["eval_data/*.jsonl"]
"sora_sandbox.conversation_gateway" = ["eval_data/*.jsonl"]

[project.scripts]
sora-sandbox = "sora_sandbox.__main__:main"
sora-gateway = "sora_sandbox.conversation_gateway.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
