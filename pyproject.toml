[project]
name = "sora-agent-state-sandbox"
version = "0.1.0"
description = "Project Sora Agent State Sandbox with DeepSeek-backed response orchestration."
requires-python = ">=3.11"
dependencies = [
    "cryptography>=43.0.0",
]

[tool.setuptools.package-data]
"sora_sandbox.worldops" = ["schemas/*.json", "eval_data/*.jsonl"]

[project.scripts]
sora-sandbox = "sora_sandbox.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
